name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A60F6C: ${{ secrets.A60F6C }}
          BE1DB0: ${{ secrets.BE1DB0 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A60F6C', '')
          k2 = os.environ.get('BE1DB0', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- d9a94bea164c6bccbee144 -->', k1) if k1 else txt
          out = out.replace('<!-- fbe9f08cdf6e327233b29fc36c693042395373 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
